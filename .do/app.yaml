# DigitalOcean App Platform spec for VIDEO-Engine (Claw console).
# Secrets are configured as DigitalOcean SECRET environment variables and
# are never committed to this repository.
#
# The dev-skills RAG vector store lives in the bound Managed Postgres `db`.
# After the first deploy, or after embedding-model/corpus changes, rebuild:
#   POST /api/claw/skills/index with {"force":true}
# GET on the same route reports configuration and stored-vector count.

name: video-engine-ccfl
region: nyc

services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: ABBYCRM/VIDEO-Engine-CCFL
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      # Readiness must be constant-time and must not depend on upstream AI
      # providers. /api/health is the operator-triggered deep diagnostic.
      http_path: /api/ready
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "3000"
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}

      - key: NVIDIA_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: APP_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET

      - key: CLAW_EMBED_MODEL
        scope: RUN_TIME
        value: nvidia/nemotron-3-embed-1b
      - key: CLAW_RERANK_MODEL
        scope: RUN_TIME
        value: nvidia/llama-3.2-nv-rerankqa-1b-v2

databases:
  - name: db
    engine: PG
    version: "16"
    production: true
