# DigitalOcean App Platform — the ONLY production frontend.
# App: video-engine-ccfl
# id: b5f68e19-fbfa-469d-acea-1d4278e8b475
# public: https://video-engine-ccfl-jpd37.ondigitalocean.app
# Source: ABBYCRM/VIDEO-Engine-CCFL @ main
#
# NOT Vercel. Vercel preview/check failures are not a ship gate.
# Coordinator force-deploys this spec after merge to main.
#
# Secrets are DigitalOcean SECRET env vars — never committed.
# Names below match keys already on this app (and the retired aion-brain
# app). Coordinator copies values; this spec only binds the names.
#
# One app. Two components from THIS repo after merge to main:
#   web         — Next.js standalone image (public :3000, /api/ready)
#   aion-brain  — absorbed Brain runtime (internal :10000, no public routes)
#
# AION_BASE_URL on web is ${aion-brain.PRIVATE_URL}.
# Do not point AION_BASE_URL at https://aion-brain-6iptg.ondigitalocean.app.
# That shared DigitalOcean app and GitHub ABBYCRM/Aion-Brain stay intact
# for another system. VIDEO only disconnects from them.

name: video-engine-ccfl
region: nyc

services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: ABBYCRM/VIDEO-Engine-CCFL
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-s
    health_check:
      http_path: /api/ready
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        scope: RUN_AND_BUILD_TIME
        value: "1"
      - key: HOSTNAME
        scope: RUN_TIME
        value: "0.0.0.0"
      - key: PORT
        scope: RUN_TIME
        value: "3000"
      - key: CLAW_ENABLED
        scope: RUN_TIME
        value: "true"
      - key: PUBLIC_BASE_URL
        scope: RUN_TIME
        value: https://video-engine-ccfl-jpd37.ondigitalocean.app
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: VECTOR_DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

      - key: BITDEER_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NVIDIA_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: APP_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AION_BASE_URL
        scope: RUN_TIME
        value: ${aion-brain.PRIVATE_URL}
      - key: AION_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: COMPOSIO_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STEEL_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STEEL_BASE_URL
        scope: RUN_TIME
        value: https://api.steel.dev
      - key: DIGITALOCEAN_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: E2B_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FIRECRAWL_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: TAVILY_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: EXA_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_PERSONAL_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: GDY_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GDY_API_KEY_ALT
        scope: RUN_TIME
        type: SECRET

      - key: BITDEER_BASE_URL
        scope: RUN_TIME
        value: https://api-inference.bitdeer.ai/v1
      - key: NVIDIA_BASE_URL
        scope: RUN_TIME
        value: https://api-inference.bitdeer.ai/v1
      - key: CLAW_NVIDIA_MODEL
        scope: RUN_TIME
        value: mistralai/Mistral-Large-3-675B-Instruct-2512
      - key: BITDEER_TEXT_MODEL
        scope: RUN_TIME
        value: mistralai/Mistral-Large-3-675B-Instruct-2512
      - key: BITDEER_IMAGE_MODEL
        scope: RUN_TIME
        value: black-forest-labs/FLUX-2-pro
      - key: CLAW_EMBED_MODEL
        scope: RUN_TIME
        value: nvidia/Nemotron-3-Embed-1B-BF16
      - key: CLAW_RERANK_MODEL
        scope: RUN_TIME
        value: BAAI/bge-reranker-v2-m3
      - key: DIGITALOCEAN_REGION
        scope: RUN_TIME
        value: nyc3

  - name: aion-brain
    dockerfile_path: Dockerfile
    source_dir: services/aion-brain
    github:
      repo: ABBYCRM/VIDEO-Engine-CCFL
      branch: main
      deploy_on_push: true
    http_port: 10000
    internal_ports:
      - 10000
    routes: []
    instance_count: 1
    instance_size_slug: basic-s
    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 5
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      - key: ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "10000"
      - key: AION_API_KEYS
        scope: RUN_TIME
        type: SECRET
      - key: AION_ADMIN_KEYS
        scope: RUN_TIME
        type: SECRET
      - key: BITDEER_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NVIDIA_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CURSOR_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: COMPOSIO_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STEEL_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: STEEL_BASE_URL
        scope: RUN_TIME
        value: https://api.steel.dev
      - key: TAVILY_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: FIRECRAWL_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: EXA_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GDY_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: N8N_MCP_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: N8N_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BITDEER_BASE_URL
        scope: RUN_TIME
        value: https://api-inference.bitdeer.ai/v1
      - key: NVIDIA_BASE_URL
        scope: RUN_TIME
        value: https://api-inference.bitdeer.ai/v1
      - key: PRIMARY_MODEL
        scope: RUN_TIME
        value: mistralai/Mistral-Large-3-675B-Instruct-2512
      - key: AGENT_MODEL
        scope: RUN_TIME
        value: mistralai/Mistral-Large-3-675B-Instruct-2512
      - key: FALLBACK_MODELS
        scope: RUN_TIME
        value: mistralai/Mistral-Large-3-675B-Instruct-2512
      - key: N8N_MCP_URL
        scope: RUN_TIME
        value: https://paisabrazil.app.n8n.cloud/mcp-server/http
      - key: N8N_BASE_URL
        scope: RUN_TIME
        value: https://paisabrazil.app.n8n.cloud

databases:
  - name: db
    engine: PG
    version: "16"
    production: true
