<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="url(#bg)"/>

  <!-- Text: OI / MEU / CHAPA! stacked, top-left -->
  <g font-family="Impact, 'Arial Black', sans-serif" font-weight="900" fill="#000">
    <text x="22" y="48" font-size="36" letter-spacing="-1">OI</text>
    <text x="22" y="84" font-size="36" letter-spacing="-1">MEU</text>
    <text x="22" y="120" font-size="36" letter-spacing="-1">CHAPA!</text>
  </g>

  <!-- Wolf head silhouette (Looney Tunes style, sharp teeth bared) -->
  <g transform="translate(56,96)">
    <!-- White hair tuft on top -->
    <path d="M 0 8 Q 12 -8 24 0 Q 36 -10 48 -2 Q 60 -8 70 4 L 80 14
             Q 88 10 92 18 L 80 30 Q 86 26 90 34
             L 70 38 L 50 36 L 28 38 L 8 34
             Q 12 26 0 30 Q 6 18 0 8 Z" fill="#FFFFFF" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Black head/face base -->
    <path d="M 6 30 L 6 78 Q 8 110 26 134 Q 44 152 60 154
             L 96 154 Q 112 152 124 140 Q 138 124 142 104
             L 142 70 Q 138 60 130 60 L 110 62
             L 90 60 L 70 62 L 50 60 L 30 62 L 12 60
             Q 6 50 6 30 Z" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>

    <!-- Angry eye -->
    <ellipse cx="44" cy="92" rx="14" ry="12" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
    <circle cx="48" cy="94" r="5" fill="#000"/>
    <circle cx="50" cy="91" r="1.5" fill="#FFF"/>
    <!-- Angry eyebrow -->
    <path d="M 28 78 L 60 84" stroke="#000" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Nose -->
    <ellipse cx="78" cy="100" rx="8" ry="6" fill="#000" stroke="#FFF" stroke-width="1"/>

    <!-- Open mouth with sharp teeth -->
    <path d="M 30 120 Q 36 138 50 144 Q 70 152 90 148 Q 110 144 120 134
             Q 116 142 108 148 Q 88 160 60 158 Q 38 154 30 138 Z" fill="#5A1010" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Teeth (sharp triangles) -->
    <g fill="#FFFFFF" stroke="#000" stroke-width="1.2" stroke-linejoin="round">
      <path d="M 36 126 L 42 144 L 48 128 Z"/>
      <path d="M 50 130 L 56 150 L 62 132 Z"/>
      <path d="M 66 132 L 72 152 L 78 134 Z"/>
      <path d="M 82 132 L 88 150 L 94 132 Z"/>
      <path d="M 98 130 L 104 146 L 110 130 Z"/>
    </g>

    <!-- Saliva/tooth glint -->
    <path d="M 70 122 L 80 118" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
