<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#FFFFFF"/>
  
  <!-- Text OI / MEU / CHAPA! - stacked, top-left, bold black -->
  <g font-family="Impact, 'Arial Black', 'Helvetica Inserat', 'Bebop', sans-serif" font-weight="900" font-style="italic" fill="#000">
    <text x="14" y="44" font-size="40" letter-spacing="-2">OI</text>
    <text x="14" y="84" font-size="40" letter-spacing="-2">MEU</text>
    <text x="14" y="124" font-size="40" letter-spacing="-2">CHAPA!</text>
  </g>

  <!-- Wolf head positioned right side, lower half -->
  <g transform="translate(72,108)">
    <!-- White hair tuft on top of head (spiky) -->
    <path d="M 0 4 
             L 8 -12 L 14 -2 L 22 -16 L 30 -4 L 38 -18 L 46 -4 L 54 -14 L 62 -2 L 70 -16 L 78 -4 L 86 -12 L 94 0
             L 100 8 L 96 16 L 86 18 L 70 20 L 50 22 L 30 20 L 14 18 L 4 16 L 0 8 Z" 
          fill="#FFFFFF" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Black wolf head (main body) -->
    <path d="M 4 16
             Q 0 28 4 42
             Q 6 60 16 78
             Q 30 96 50 102
             L 90 102
             Q 116 98 132 80
             Q 144 64 144 42
             Q 144 26 138 18
             L 130 18
             L 110 20 L 90 18 L 70 20 L 50 18 L 30 20 L 10 18 Z" 
          fill="#000" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- White hair tuft edge on top of head -->
    <path d="M 4 16
             L 14 6 L 24 12 L 36 4 L 48 10 L 60 2 L 72 10 L 84 2 L 96 10 L 108 4 L 120 12 L 130 6 L 138 18
             L 130 20 L 110 22 L 90 20 L 70 22 L 50 20 L 30 22 L 10 20 L 4 16 Z" 
          fill="#FFFFFF" stroke="#000" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- White eye socket (left visible) -->
    <ellipse cx="34" cy="44" rx="14" ry="13" fill="#FFFFFF" stroke="#000" stroke-width="2.5"/>
    <!-- Yellow iris -->
    <circle cx="38" cy="46" r="6" fill="#FFD700" stroke="#000" stroke-width="1"/>
    <!-- Black pupil -->
    <circle cx="40" cy="46" r="3" fill="#000"/>
    
    <!-- Angry eyebrow (thick angled black line above eye) -->
    <path d="M 18 30 L 50 38" stroke="#000" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Black nose -->
    <ellipse cx="76" cy="56" rx="10" ry="7" fill="#000" stroke="#000" stroke-width="1"/>
    
    <!-- Open mouth (dark red interior) -->
    <path d="M 18 76
             Q 16 90 26 100
             Q 42 110 60 110
             Q 80 112 100 108
             Q 120 102 130 90
             Q 124 100 116 104
             L 18 76 Z" 
          fill="#5C1010" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Upper teeth row (sharp white triangles, top of mouth) -->
    <g fill="#FFFFFF" stroke="#000" stroke-width="1.5" stroke-linejoin="round">
      <path d="M 20 80 L 24 100 L 32 84 Z"/>
      <path d="M 34 86 L 40 104 L 48 88 Z"/>
      <path d="M 50 88 L 56 106 L 64 90 Z"/>
      <path d="M 66 90 L 72 106 L 80 90 Z"/>
      <path d="M 82 90 L 88 104 L 96 90 Z"/>
      <path d="M 98 88 L 104 102 L 112 88 Z"/>
      <path d="M 114 86 L 120 98 L 126 86 Z"/>
    </g>
    
    <!-- Lower teeth row (smaller, bottom of mouth) -->
    <g fill="#FFFFFF" stroke="#000" stroke-width="1.2" stroke-linejoin="round">
      <path d="M 32 110 L 36 100 L 40 110 Z"/>
      <path d="M 48 112 L 52 102 L 56 112 Z"/>
      <path d="M 64 112 L 68 102 L 72 112 Z"/>
      <path d="M 80 110 L 84 100 L 88 110 Z"/>
      <path d="M 96 108 L 100 100 L 104 108 Z"/>
    </g>
  </g>
</svg>
