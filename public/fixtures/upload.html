<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload document</title>
    <style>
      body { font-family: sans-serif; background: #0c0c0e; color: #f2f2f4; margin: 0; padding: 32px; }
      input { margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>Upload a session file</h1>
    <p>File chooser is limited to this session's uploads folder.</p>
    <form>
      <label for="doc">Document</label>
      <input id="doc" name="doc" type="file" />
    </form>
  </body>
</html>
