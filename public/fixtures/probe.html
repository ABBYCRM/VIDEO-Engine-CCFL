<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claw Forge fingerprint lab</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: #d8dbe0;
        color: #16161a;
        display: grid;
        place-items: center;
      }
      main {
        width: min(640px, 92vw);
        background: #f4f4f5;
        border: 1px solid #c8ccd4;
        border-radius: 16px;
        padding: 28px;
      }
      h1 { font-size: 28px; letter-spacing: -0.03em; margin: 0 0 8px; }
      p { color: #3f3f46; line-height: 1.55; }
      code { font-family: ui-monospace, monospace; color: #111; }
    </style>
  </head>
  <body>
    <main>
      <h1>Fingerprint lab</h1>
      <p>
        Owned page for Claw Forge. Probe this tab to measure userAgent, webdriver,
        WebGL, canvas digest, and Worker-visible hardware values. This is not a
        CAPTCHA and not a third-party challenge.
      </p>
      <p>Lab marker: <code>claw-forge-probe-surface</code></p>
    </main>
  </body>
</html>
