# .deploy/digitalocean.app.yaml
# Declarative App Platform spec for VIDEO-Engine-CCFL.
# Secrets remain in DigitalOcean runtime configuration, never Git.

name: video-engine-ccfl
region: nyc

services:
  - name: video-engine-ccfl
    github:
      repo: ABBYCRM/VIDEO-Engine-CCFL
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 3000
    health_check:
      http_path: /api/health
    envs:
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_WITH_ADMIN_PASSWORD"
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_WITH_64_BYTE_HEX"
      - key: APP_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_WITH_44_BYTE_BASE64"
      - key: PUBLIC_BASE_URL
        scope: RUN_TIME
        type: GENERAL
        value: "https://video-engine-ccfl-jpd37.ondigitalocean.app"
      - key: PORT
        scope: RUN_TIME
        type: GENERAL
        value: "3000"
      - key: NODE_ENV
        scope: RUN_TIME
        type: GENERAL
        value: "production"

      # NovaLuis is the durable Library/database boundary. Generated media is
      # persisted in public.library_assets so App Platform redeploys cannot
      # erase the Library. Local SQLite remains a dev/test compatibility layer.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_WITH_NOVALUIS_PG_URL"
      - key: DATABASE_NAME
        scope: RUN_TIME
        type: GENERAL
        value: "novaluis"

      - key: HEDRA_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_WITH_HEDRA_KEY"
      - key: XAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_WITH_XAI_KEY"
      - key: COMPOSIO_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_WITH_COMPOSIO_KEY"
      - key: NVIDIA_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_WITH_NVIDIA_KEY"
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_WITH_GEMINI_KEY"
      - key: A2E_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_WITH_A2E_KEY"

# Bind the existing NovaLuis managed PostgreSQL cluster to this app in the
# DigitalOcean control plane. App Platform does not provide persistent local
# volumes; DATABASE_URL must resolve to NovaLuis for production durability.
# Example after the cluster UUID is known:
# databases:
#   - name: novaluis
#     engine: PG
#     version: "16"
#     cluster_id: "REPLACE_WITH_NOVALUIS_CLUSTER_UUID"
databases: []
